name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the STL fixtures used by the 3D regression test
        run: >-
          git lfs pull
          --include="ems-files/ft-ems-trident-doom-rear-1-4.stl,ems-files/ft-ems-trident-doom-rear-2-4.stl,ems-files/ft-ems-trident-doom-rear-3-4.stl,ems-files/ft-ems-trident-doom-rear-4-4.stl,ems-files/ft-btt-octopus-mount.stl,ems-files/FT EMS SW Frame V2.stl,ems-files/FT_ems_swc_v2_frame.stl,ems-files/ft-btt-skr-mini-e3-mount.stl,ems-files/ft-raspberry-pi-3-4-mount.stl"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
